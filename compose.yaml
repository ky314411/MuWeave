name: muweave

services:
  app:
    image: muweave:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
      args:
        NODE_IMAGE: ${MUWEAVE_NODE_IMAGE:-node:24-bookworm-slim}
        INSTALL_TRANSCRIPTION: ${MUWEAVE_TRANSCRIPTION:-false}
        HTTP_PROXY: ${MUWEAVE_PROXY:-}
        HTTPS_PROXY: ${MUWEAVE_PROXY:-}
    init: true
    restart: unless-stopped
    stop_grace_period: 40s
    ports:
      - "127.0.0.1:${MUWEAVE_PORT:-8080}:8000"
    environment:
      MUWEAVE_DATA_DIR: /data
      MUWEAVE_MASTER_KEY_FILE: /run/muweave-secrets/master.key
      HTTP_PROXY: ${MUWEAVE_PROXY:-}
      HTTPS_PROXY: ${MUWEAVE_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,::1,host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - data:/data
      - keys:/run/muweave-secrets
      - ${MUWEAVE_MODELS_DIR:-models}:/models:ro
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
  keys:
  models:
