name: Verify MuWeave

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  UV_LINK_MODE: copy

jobs:
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.8.17'
          enable-cache: true
      - name: Install Linux media tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install Windows media tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            Add-Content -LiteralPath $env:GITHUB_PATH -Value 'C:\ProgramData\chocolatey\bin'
          }
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check backend
      - run: uv run ruff format --check backend
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.8.17'
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: uv sync --locked --python 3.12
      - run: npm ci --no-fund --no-audit
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
